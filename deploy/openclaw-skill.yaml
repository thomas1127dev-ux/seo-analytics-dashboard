# OpenClaw Skill 多环境配置模板
# 各环境可覆盖 deploy/.env 中的变量，或供 openclaw_skill.py 读取

environments:
  dev:
    public_base_url: "http://localhost:5173"
    public_backend_url: "http://localhost:4000"
    backend_port: "4000"
    frontend_port: "5173"
  stage:
    public_base_url: "https://seo-dashboard-stage.example.com"
    public_backend_url: "https://api-seo-dashboard-stage.example.com"
    backend_port: "4000"
    frontend_port: "80"
  prod:
    public_base_url: "https://seo-dashboard.example.com"
    public_backend_url: "https://api-seo-dashboard.example.com"
    backend_port: "4000"
    frontend_port: "80"

[project]
name = "seo-analytics-dashboard-backend"
version = "0.1.0"
description = "Backend service for multi-site SEO analytics dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "mysqlclient==2.2.5",
    "google-auth==2.37.0",
    "google-analytics-data==0.18.10",
    "google-api-python-client==2.154.0",
    "requests==2.32.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "questionary==2.0.1",
]

[tool.uv]
dev-dependencies = []
scripts = { api = "uvicorn app.main:app --host 0.0.0.0 --port 4000", cli = "python -m app.manage" }

